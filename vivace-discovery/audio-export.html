<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vivace — Audio Export</title><style>body{font-family:Arial,sans-serif;background:#14392D;color:#fff;margin:0;padding:24px}.box{max-width:560px;margin:auto;background:#fff;color:#14392D;border-radius:18px;padding:20px}.item{padding:14px 0;border-bottom:1px solid #ddd}.btn{display:inline-block;margin-top:8px;padding:10px 16px;border:0;border-radius:999px;background:#B85F3E;color:#fff;text-decoration:none;font-weight:700}small{opacity:.7}</style></head><body><div class="box"><h2>הקלטות Vivace — בדיקה</h2><p>הדף קורא רק את ההקלטות ששמורות בדפדפן הזה. הוא לא שולח אותן לשום מקום.</p><div id="list">טוען…</div></div><script>
const DB='vivace-owner-discovery-audio-v1',STORE='recordings';
function ext(r){const m=(r.mimeType||r.blob?.type||'').toLowerCase();return m.includes('ogg')?'ogg':m.includes('wav')?'wav':(m.includes('mp4')||m.includes('m4a'))?'m4a':'webm'}
function getAll(){return new Promise(resolve=>{const req=indexedDB.open(DB,1);req.onerror=()=>resolve([]);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'questionId'})};req.onsuccess=()=>{const db=req.result;const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>{db.close();resolve(r.result||[])};r.onerror=()=>{db.close();resolve([])}}})}
(async()=>{const list=document.getElementById('list');const rows=await getAll();if(!rows.length){list.textContent='לא נמצאו הקלטות בדפדפן הזה.';return}list.innerHTML='';rows.sort((a,b)=>Number(a.questionId)-Number(b.questionId)).forEach(r=>{const d=document.createElement('div');d.className='item';const url=URL.createObjectURL(r.blob);d.innerHTML=`<b>שאלה ${r.questionId}</b><br><small>${Math.round((r.blob?.size||0)/1024)} KB</small><br>`;const a=document.createElement('a');a.className='btn';a.href=url;a.download=`Vivace-Q${String(r.questionId).padStart(2,'0')}.${ext(r)}`;a.textContent='הורד הקלטה';d.appendChild(a);list.appendChild(d)})})()
</script></body></html>
