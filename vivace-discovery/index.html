<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14392D"><title>Vivace OS — Discovery</title><style>body{margin:0;background:#14392D;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}.l{padding:24px}.s{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#D6B36C;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div class="s"></div><b>טוען את שאלון Vivace OS…</b></div><script>(async()=>{const p=[];for(let i=0;i<7;i++){const r=await fetch(`v5.part${String(i).padStart(2,'0')}.b64?v=5`,{cache:'no-store'});if(!r.ok)throw new Error('part '+i);p.push(await r.text())}const b=atob(p.join('').replace(/\s+/g,'')),u=Uint8Array.from(b,c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip'),t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text(),patched=t.replace('</body>','<script src="v9patch.js?v=9.0"><'+'/script></body>');document.open();document.write(patched);document.close()})().catch(e=>{console.error(e);document.body.innerHTML='<div class="l"><b>לא ניתן לטעון את הטופס</b><p>נסה לרענן את הדף.</p></div>'})</script></body></html>
