<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#EA4A3E">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Vivace OS — Discovery</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#FBF8F4;color:#312824;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;min-height:100vh;text-align:center}
    .vboot{width:min(360px,calc(100% - 36px));padding:34px 24px;border:1px solid #E9DDD5;border-radius:24px;background:#fff;box-shadow:0 18px 48px rgba(72,45,35,.12)}
    .vboot-mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 17px;border-radius:20px;background:#EA4A3E;color:#fff;font-size:30px;font-weight:950;box-shadow:0 10px 24px rgba(234,74,62,.25)}
    .vboot-title{display:block;font-size:18px;font-weight:900}
    .vboot-copy{display:block;margin-top:7px;color:#74635B;font-size:13px}
    .vboot-line{position:relative;width:116px;height:4px;margin:20px auto 0;overflow:hidden;border-radius:999px;background:#F3D9D5}
    .vboot-line::after{content:"";position:absolute;inset:0;width:45%;border-radius:inherit;background:#EA4A3E;animation:vbootMove 1s ease-in-out infinite alternate}
    @keyframes vbootMove{to{transform:translateX(-125%)}}
    @media(max-width:480px){.vboot{width:calc(100% - 28px);padding:30px 20px;border-radius:20px}}
  </style>
</head>
<body>
  <div class="vboot" role="status" aria-live="polite">
    <div class="vboot-mark" aria-hidden="true">V</div>
    <b class="vboot-title">מכין את שאלון Vivace</b>
    <span class="vboot-copy">עוד רגע אפשר להתחיל</span>
    <div class="vboot-line" aria-hidden="true"></div>
  </div>
  <script>
  (async()=>{
    try{
      const qs=new URLSearchParams(location.search);
      const inviteKey='vivace-invite-token-v1';

      if(qs.get('admin')==='1'){
        const endpoint='https://eadljasmuqnzcrfudsib.supabase.co/functions/v1/vivace-admin';
        const loginEndpoint='https://eadljasmuqnzcrfudsib.supabase.co/functions/v1/vivace-admin-login';
        const response=await fetch(endpoint,{cache:'no-store'});
        if(!response.ok)throw new Error('admin '+response.status);
        let html=await response.text();
        html=html.replace("const ENDPOINT=location.href.split('?')[0];",`const ENDPOINT='${endpoint}';const LOGIN_ENDPOINT='${loginEndpoint}';`);
        html=html.replace("async function loginWithKey(key){const r=await fetch(ENDPOINT,","async function loginWithKey(key){const r=await fetch(LOGIN_ENDPOINT,");
        if(!html.includes('const LOGIN_ENDPOINT='))throw new Error('admin login patch failed');
        document.open();
        document.write(html);
        document.close();
        return;
      }

      if(qs.get('new')==='1'){
        const sid=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`;
        qs.delete('new');
        qs.set('session',sid);
        qs.set('build','clean-ui-21-0');
        history.replaceState(null,'',`${location.pathname}?${qs.toString()}`);
      }

      const sid=qs.get('session');
      const invite=qs.get('invite');
      if(invite){
        try{sessionStorage.setItem(sid?`vivace-session:${sid}:${inviteKey}`:inviteKey,invite)}catch{}
        qs.delete('invite');
        history.replaceState(null,'',`${location.pathname}${qs.toString()?`?${qs.toString()}`:''}`);
      }

      if(sid){
        const prefix=`vivace-session:${sid}:`;
        const getItem=Storage.prototype.getItem;
        const setItem=Storage.prototype.setItem;
        const removeItem=Storage.prototype.removeItem;
        Storage.prototype.getItem=function(key){return getItem.call(this,(this===localStorage||this===sessionStorage)?prefix+key:key)};
        Storage.prototype.setItem=function(key,value){return setItem.call(this,(this===localStorage||this===sessionStorage)?prefix+key:key,value)};
        Storage.prototype.removeItem=function(key){return removeItem.call(this,(this===localStorage||this===sessionStorage)?prefix+key:key)};
        const openDatabase=indexedDB.open.bind(indexedDB);
        const deleteDatabase=indexedDB.deleteDatabase.bind(indexedDB);
        indexedDB.open=(name,...args)=>openDatabase(prefix+name,...args);
        indexedDB.deleteDatabase=name=>deleteDatabase(prefix+name);
      }

      const parts=[];
      for(let index=0;index<7;index++){
        const response=await fetch(`v5.part${String(index).padStart(2,'0')}.b64?v=5.1`,{cache:'no-store'});
        if(!response.ok)throw new Error('part '+index);
        parts.push(await response.text());
      }

      const binary=atob(parts.join('').replace(/\s+/g,''));
      const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
      const stream=new DecompressionStream('gzip');
      const baseHtml=await new Response(new Blob([bytes]).stream().pipeThrough(stream)).text();
      const bootGuard='<style id="v15BootGuard">#v15BootScreen{position:fixed!important;inset:0!important;z-index:2147483647!important;display:grid!important;place-items:center!important;min-height:100vh!important;background:#FBF8F4!important;color:#312824!important;font-family:Arial,sans-serif!important;text-align:center!important}#v15BootScreen .vboot{width:min(360px,calc(100% - 36px));padding:34px 24px;border:1px solid #E9DDD5;border-radius:24px;background:#fff;box-shadow:0 18px 48px rgba(72,45,35,.12)}#v15BootScreen .vboot-mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 17px;border-radius:20px;background:#EA4A3E;color:#fff;font-size:30px;font-weight:950}#v15BootScreen .vboot-title{display:block;font-size:18px;font-weight:900}#v15BootScreen .vboot-copy{display:block;margin-top:7px;color:#74635B;font-size:13px}#v15BootScreen .vboot-line{position:relative;width:116px;height:4px;margin:20px auto 0;overflow:hidden;border-radius:999px;background:#F3D9D5}#v15BootScreen .vboot-line:after{content:"";position:absolute;inset:0;width:45%;border-radius:inherit;background:#EA4A3E;animation:v15BootMove 1s ease-in-out infinite alternate}@keyframes v15BootMove{to{transform:translateX(-125%)}}</style>';
      const bootScreen='<div id="v15BootScreen" role="status" aria-live="polite"><div class="vboot"><div class="vboot-mark" aria-hidden="true">V</div><b class="vboot-title">מכין את שאלון Vivace</b><span class="vboot-copy">עוד רגע אפשר להתחיל</span><div class="vboot-line" aria-hidden="true"></div></div></div>';
      const guardedHtml=baseHtml.replace('<head>',`<head>${bootGuard}`).replace('<body>',`<body>${bootScreen}`);
      const patchScripts=['v13audioguard.js?v=21.0','v14preview.js?v=21.0','v9patch.js?v=21.0','v12invite.js?v=21.0','v15sendready.js?v=21.0'].map(src=>`<script src="${src}"><`+'/script>').join('');
      const failSafe='<script>setTimeout(()=>{const screen=document.getElementById("v15BootScreen");if(!screen)return;screen.querySelector(".vboot-title").textContent="לא ניתן לטעון את השאלון";screen.querySelector(".vboot-copy").textContent="רענן את הדף ונסה שוב";screen.querySelector(".vboot-line")?.remove()},15000);<'+'/script>';
      const patched=guardedHtml.replace('</body>',`${patchScripts}${failSafe}</body>`);
      document.open();
      document.write(patched);
      document.close();
    }catch(error){
      console.error(error);
      document.body.innerHTML='<div class="vboot"><div class="vboot-mark" aria-hidden="true">V</div><b class="vboot-title">לא ניתן לטעון את השאלון</b><span class="vboot-copy">רענן את הדף ונסה שוב</span></div>';
    }
  })();
  </script>
</body>
</html>
