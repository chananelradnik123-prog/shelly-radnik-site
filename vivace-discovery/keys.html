<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Vivace OS — ניהול מפתחות</title>
  <style>
    :root{--g:#14392d;--g2:#0e2b22;--cream:#f7f3eb;--rust:#b85f3e;--gold:#d6b36c;--ink:#17231e;--muted:#68756f;--bad:#8b2f25}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--g2),var(--g));font-family:Arial,sans-serif;color:var(--ink)}
    .wrap{max-width:860px;margin:auto;padding:18px}.head{color:#fff;padding:12px 4px 20px}.head h1{margin:0 0 7px}.head p{margin:0;opacity:.78;line-height:1.55}
    .card{background:var(--cream);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px #0003}.login{max-width:520px;margin:40px auto}
    input,textarea{width:100%;padding:13px;border:1px solid #d7d7d1;border-radius:12px;font-size:15px;margin:9px 0;background:#fff;color:var(--ink)}textarea{font-family:monospace;direction:ltr;text-align:left;min-height:105px;word-break:break-all}
    .btn{border:0;border-radius:999px;background:var(--rust);color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.btn.secondary{background:var(--g)}.btn.light{background:#e4ddd1;color:var(--ink)}.btn:disabled{opacity:.55;cursor:default}
    .row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:9px;flex-wrap:wrap}.muted{color:var(--muted);font-size:13px;line-height:1.55}.error{color:var(--bad);font-weight:700;margin-top:10px}.notice{background:#fff1d2;border:1px solid #ead19b;border-radius:13px;padding:12px;line-height:1.6;margin:12px 0}.success{background:#e7f0e9;border:1px solid #bfd1c3;border-radius:13px;padding:12px;line-height:1.6;margin:12px 0}
    .keyrow{padding:12px 0;border-bottom:1px solid #ddd8cf}.keyrow:last-child{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#e8efe9;color:var(--g);font-size:12px;font-weight:700}.pill.retiring{background:#fff1d2}.pill.revoked{background:#f5dcd7;color:var(--bad)}
    h2,h3{margin-top:0}@media(max-width:600px){.wrap{padding:12px}.card{padding:15px;border-radius:16px}.btn{width:100%}.actions{width:100%}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>Vivace OS — ניהול מפתחות</h1><p>מסך מוגן ליצירת מפתח חלופי בלי לנתק את המפתח הקיים. יצירת מפתח אינה מבטלת שום חיבור.</p></div>
  <div id="app"></div>
</div>
<script>
(()=>{'use strict';
const LOGIN='https://eadljasmuqnzcrfudsib.supabase.co/functions/v1/vivace-admin-login';
const MANAGER='https://eadljasmuqnzcrfudsib.supabase.co/functions/v1/vivace-key-manager';
const ADMIN='https://eadljasmuqnzcrfudsib.supabase.co/functions/v1/vivace-admin';
const SESSION_KEY='vivace_key_rotation_session';
const app=document.getElementById('app');
let session='';try{session=sessionStorage.getItem(SESSION_KEY)||''}catch{}
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function fmt(s){try{return new Date(s).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}catch{return s||'—'}}
async function request(url,body,headers={}){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json',...headers},body:JSON.stringify(body),cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{status:r.status});return j}
function setSession(value){session=value||'';try{if(session)sessionStorage.setItem(SESSION_KEY,session);else sessionStorage.removeItem(SESSION_KEY)}catch{}}
function login(message=''){app.innerHTML='<div class="card login"><h2>כניסה מאובטחת</h2><p class="muted">המפתח הראשי משמש רק ליצירת session זמני. הוא אינו נשמר בדפדפן.</p><input id="master" type="password" autocomplete="current-password" placeholder="מפתח ניהול ראשי"><button id="login" class="btn">כניסה</button><div class="error">'+esc(message)+'</div></div>';document.getElementById('login').onclick=async()=>{const input=document.getElementById('master'),key=input.value.trim();input.value='';try{const r=await request(LOGIN,{action:'login'},{'x-vivace-admin-key':key});if(!r.sessionToken)throw new Error('SESSION_CREATE_FAILED');setSession(r.sessionToken);await dashboard()}catch(e){setSession('');login(e.message==='RATE_LIMITED'?'יותר מדי ניסיונות. נסה מאוחר יותר.':'המפתח אינו תקין.')}}}
async function manager(body){try{return await request(MANAGER,body,{'x-vivace-admin-session':session})}catch(e){if(e.status===401){setSession('');login('ה-session פג. יש להתחבר מחדש.')}throw e}}
function keyRows(items){if(!items?.length)return'<div class="muted">אין מפתחות.</div>';return items.map(k=>'<div class="keyrow"><div class="row"><div><b>'+esc(k.label)+'</b><div class="muted">נוצר: '+fmt(k.created_at)+' · שימושים: '+Number(k.use_count||0)+(k.last_used_at?' · שימוש אחרון: '+fmt(k.last_used_at):'')+'</div></div><span class="pill '+esc(k.status)+'">'+esc(k.status)+'</span></div></div>').join('')}
async function dashboard(){app.innerHTML='<div class="card">טוען מצב מפתחות…</div>';try{const r=await manager({action:'list'});app.innerHTML='<div class="card"><div class="row"><div><h2 style="margin:0">מצב נוכחי</h2><div class="muted">המפתחות הקיימים נשארים פעילים עד ביטול ידני ומאושר.</div></div><button id="logout" class="btn secondary">התנתק</button></div></div><div class="card"><div class="row"><h3>מפתחות ניהול</h3><button id="newAdmin" class="btn">צור מפתח ניהול חדש</button></div>'+keyRows(r.keys?.admin)+'</div><div class="card"><div class="row"><h3>מפתחות MCP / ChatGPT</h3><button id="newMcp" class="btn">צור מפתח MCP חדש</button></div>'+keyRows(r.keys?.mcp)+'</div><div class="notice"><b>זהירות:</b> יצירת מפתח חדש אינה מבטלת את הישן. קודם שומרים את החדש, בודקים שהוא עובד, ורק לאחר אישור נפרד מבטלים את הישן.</div>';document.getElementById('logout').onclick=logout;document.getElementById('newAdmin').onclick=()=>createKey('admin');document.getElementById('newMcp').onclick=()=>createKey('mcp')}catch(e){if(e.status!==401)app.innerHTML='<div class="card error">שגיאה: '+esc(e.message)+'</div>'}}
async function createKey(type){const label=prompt(type==='admin'?'שם לזיהוי מפתח הניהול החדש:':'שם לזיהוי מפתח ה-MCP החדש:',type==='admin'?'admin-rotation':'mcp-rotation');if(label===null)return;if(!confirm('ייווצר מפתח חדש. המפתח הקיים יישאר פעיל ולא יתבצע ניתוק. להמשיך?'))return;try{const r=await manager({action:'create',type,label});const k=r.key;if(!k?.rawKey)throw new Error('KEY_NOT_RETURNED');showKey(k)}catch(e){if(e.status!==401)alert(e.message==='TOO_MANY_ACTIVE_KEYS'?'יש כבר יותר מדי מפתחות פעילים. אין ליצור נוסף לפני בדיקה.':e.message==='RATE_LIMITED'?'הגעת למגבלת יצירת המפתחות היומית.':'יצירת המפתח נכשלה: '+e.message)}}
function showKey(k){app.innerHTML='<div class="card"><h2>המפתח החדש נוצר</h2><div class="notice"><b>זה העותק היחיד שיוצג.</b> העתק ושמור אותו במקום פרטי. אל תשלח אותו בצ’אט, במייל או בהודעה.</div><div class="muted">סוג: '+esc(k.type)+' · שם: '+esc(k.label)+'</div><textarea id="raw" readonly>'+esc(k.rawKey)+'</textarea><div class="actions"><button id="copy" class="btn">העתק</button><button id="back" class="btn secondary">חזרה בלי לבטל את הישן</button></div><div id="copyState" class="success" style="display:none">המפתח הועתק. עדיין יש לשמור אותו במקום פרטי ולבדוק אותו לפני ביטול הישן.</div><div class="notice">'+(k.type==='mcp'?'השלב הבא יהיה לחבר את Vivace OS ל-ChatGPT עם המפתח החדש. החיבור הישן נשאר פעיל בינתיים.':'השלב הבא יהיה לבדוק את המפתח בחלון פרטי חדש. המפתח הישן נשאר פעיל בינתיים.')+'</div></div>';document.getElementById('copy').onclick=async()=>{const value=document.getElementById('raw').value;try{await navigator.clipboard.writeText(value)}catch{document.getElementById('raw').select();document.execCommand('copy')}document.getElementById('copyState').style.display='block'};document.getElementById('back').onclick=dashboard}
async function logout(){try{if(session)await request(ADMIN,{action:'logout'},{'x-vivace-admin-session':session})}catch{}setSession('');login('התנתקת בהצלחה.')}
if(session)dashboard();else login();
})();
</script>
</body>
</html>
